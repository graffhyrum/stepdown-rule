name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Compile release binaries
        run: bun run compile:release

      - name: Show checksums
        run: cat dist/release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Standalone `stepdown-rule` binaries (Bun runtime embedded; no Bun install required at runtime).

            **Preferred install** (download → inspect → run):

            ```shell
            curl -fsSL -o install.sh https://github.com/graffhyrum/stepdown-rule/releases/latest/download/install.sh
            less install.sh   # review, then:
            bash install.sh
            ```

            ```powershell
            Invoke-WebRequest -Uri https://github.com/graffhyrum/stepdown-rule/releases/latest/download/install.ps1 -OutFile install.ps1
            # review install.ps1, then:
            powershell -File .\install.ps1
            ```

            Installers verify `SHA256SUMS` before writing the binary. Pin with `VERSION=vX.Y.Z`.

            See README for trust model, pipe-to-shell warnings, and PATH setup.
          files: |
            dist/release/*
            scripts/install.sh
            scripts/install.ps1
