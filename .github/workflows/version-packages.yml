name: Version Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: version-packages
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags so changeset tag can detect missing versions
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          # changeset tag is local-only; push so release.yml (on: push tags v*) fires
          publish: bunx changeset tag && git push origin --follow-tags
          title: "Version Packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
