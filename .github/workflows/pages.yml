name: Pages

# Pin short install URLs to release tags (not main HEAD) so Pages scripts
# match the installers attached to the same GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage short install URLs
        run: |
          mkdir -p _site
          cp scripts/install.sh _site/install
          cp scripts/install.ps1 _site/install.ps1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
